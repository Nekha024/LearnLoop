{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mentor Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>
{% block style %}
{% endblock %}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

/* Dark background */
body{
    background:radial-gradient(circle at top,#0f172a,#020617);
    color:#e5e7eb;
}

/* ---------- TOP NAV ---------- */
.top-nav{
    background:#020617;
    border-bottom:1px solid rgba(255,255,255,0.08);
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    font-size:22px;
    font-weight:bold;
    color:#818cf8;
}

/* Navigation buttons */
.nav-links{
    display:flex;
    gap:15px;
}

.nav-link{
    background:none;
    border:none;
    color:#9ca3af;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
}

.nav-link:hover,
.nav-link.active{
    background:rgba(99,102,241,0.15);
    color:#c7d2fe;
}

/* Main area */
.main-content{
    padding:40px;

}
</style>
</head>

<body>

<!-- TOP NAV BAR -->
<nav class="top-nav">
    <div class="brand">Mentor Hub</div>

   <div class="nav-links">
    <a href="{% url 'mentor_dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'mentor_dashboard' %}active{% endif %}">Session Dashboard</a>
    <a href="{% url 'mentor_profile_setup' %}" class="nav-link {% if request.resolver_match.url_name == 'mentor_profile_setup' %}active{% endif %}">Profile & Setup</a>
    <a href="{% url 'mentor_content' %}" class="nav-link {% if request.resolver_match.url_name == 'mentor_content' %}active{% endif %}">Content Contribution</a>
    <a href="{% url 'auth' %}" class="nav-link btn ">Logout</a>
</div>

</nav>

<!-- PAGE CONTENT -->
<main class="main-content">
    {% block content %}
    {% endblock %}
</main>

<!-- SCRIPT (Kept & Working) -->
 <script>
const navLinks = document.querySelectorAll('.nav-link');
const contentViews = document.querySelectorAll('.content-view');

function showView(targetId){
    navLinks.forEach(link=>{
        link.classList.toggle('active', link.dataset.target === targetId);
    });

    contentViews.forEach(view=>{
        view.style.display = (view.id === targetId) ? "block" : "none";
    });
}

// Only buttons with data-target toggle views
navLinks.forEach(link=>{
    if(link.dataset.target){
        link.addEventListener('click',()=>showView(link.dataset.target));
    }
});
</script>

</body>
</html>
